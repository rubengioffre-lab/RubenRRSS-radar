name: Radar

on:
  schedule:
    - cron: "17 * * * *"   # una vez por hora
  workflow_dispatch:        # tambien se puede correr a mano

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rastrear tendencias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python robot/radar.py
      - name: Guardar resultados
        run: |
          git config user.name "Grow UP Radar"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Radar: actualizacion automatica"
          git push
