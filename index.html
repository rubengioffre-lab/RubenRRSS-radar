.nom{font:400 25px/.9 "Special Gothic Condensed One","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em}

.per{margin-top:8px;gap:6px}

main{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.cal{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chip{border:1px solid var(--line);color:var(--mut);border-radius:4px;padding:3px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:54px 1fr;gap:4px 14px}
.n{font:400 46px/.9 "Special Gothic Condensed One","Arial Narrow",sans-serif;color:var(--acc);text-align:left}
.card h3{margin:0;font-size:17px;font-weight:600;line-height:1.28}
.meta{color:var(--mut);font-size:12.5px;margin-top:5px}
.meta b{background:var(--acc);color:var(--on);padding:1px 6px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.cuerpo{grid-column:2}
.cuerpo>.meta{border-left:2px solid var(--acc);padding-left:10px;margin-top:8px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--tx);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
ul{margin:8px 0 0;padding-left:18px}
li{margin-bottom:5px;font-size:13.5px;color:var(--mut)}
a{color:var(--tx);text-decoration:none}
a:hover{text-decoration:underline}
.acc{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.acc button{font-size:12.5px;padding:5px 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.caja{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.caja h2{font:400 24px/.95 "Special Gothic Condensed One","Arial Narrow",sans-serif;text-transform:uppercase;margin:0 0 4px}
.caja .rot{margin:0 0 6px}
.caja p{margin:0 0 10px;color:var(--mut);font-size:12.5px}
.it{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.it .k{flex:1;min-width:0}
.it .v{color:var(--mut);font-size:12.5px;white-space:nowrap}
.it .v a{color:var(--mut)}
.it .cp{border:0;padding:0 4px;color:var(--mut);background:none}
.est{display:inline-block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:2px 7px 1px;margin:0 8px 6px 0;border:1px solid var(--acc);vertical-align:middle}
.est.despegando{background:var(--acc);color:var(--on)}
.est.pico{color:var(--tx)}
.est.bajando{border-color:var(--line);color:var(--mut)}
.pt{display:inline-block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 6px;vertical-align:middle}
.pt b{font:400 20px/1 "Special Gothic Condensed One","Arial Narrow",sans-serif;color:var(--tx);letter-spacing:0;margin-left:4px}
.res{font:italic 400 16.5px/1.35 "Fraunces",Georgia,serif;margin:8px 0 0}
.ang{margin-top:10px;border-left:2px solid var(--acc);padding-left:12px}
.ang div{margin-bottom:8px;font-size:14px}
.ang span{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.orig{color:var(--mut);font-size:12.5px;margin-top:6px}
.dia{display:grid;grid-template-columns:86px 1fr;gap:4px 16px;padding:14px 0;border-top:1px solid var(--line)}
.dia .f{font:400 34px/.9 "Special Gothic Condensed One","Arial Narrow",sans-serif;text-transform:uppercase}
.dia .f small{display:block;font:400 10.5px/1.4 "Special Gothic",sans-serif;letter-spacing:.16em;color:var(--mut);margin-top:5px}
.dia h3{margin:0;font-size:16.5px;font-weight:600}
.dia p{margin:6px 0 0;color:var(--mut);font-size:13.5px;border-left:2px solid var(--acc);padding-left:10px}
.mes{font:400 26px/1 "Special Gothic Condensed One","Arial Narrow",sans-serif;text-transform:uppercase;margin:26px 0 8px}
.filtros{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;margin:0 0 16px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.filtros .g{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.filtros .rot{margin:0 4px 0 0}

.viene{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}

.vacio{color:var(--mut);padding:30px 0;text-align:center}
.aviso{border-left:2px solid var(--acc);padding:2px 0 2px 12px;font-size:13.5px;margin-bottom:16px;color:var(--mut)}
.aviso i{font:italic 400 19px/1.3 "Fraunces",Georgia,serif;color:var(--tx);display:block;margin-bottom:2px}
.aviso a{text-decoration:underline}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:#3A0D17;padding:8px 16px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}

    <h1>Radar <span>RRSS</span></h1>
    <span class="act" id="act">Cargando…</span>
    <button id="btnMarca" title="Para quién se arma el brief que se copia"></button>
    <button id="btnTema" title="Cambiar entre titular (granate) y suplente (negro)">◐</button>

<div id="toast"></div>
<script>
const PERIODOS = {ahora:"Ahora (4 h)", "24h":"Últimas 24 h", semana:"Última semana", mes:"Último mes"};
let D = null, tab = "paravos", per = "24h", marca = "personal";
const ESTADOS = {despegando: "Despegando", pico: "En el pico", bajando: "Bajando"};
// Filtros: fEst = etiquetas elegidas (vacio = todas), fMin = puntaje minimo, fOrd = orden
let F = {est: [], min: {paravos: 6, cat: 0}, ord: {paravos: "tendencia", cat: "medios"}};
try{ const g = JSON.parse(leer0("radar_filtros") || "null"); if(g && g.min && g.ord && Array.isArray(g.est)) F = g; }catch(e){}
function leer0(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
const RANGO = {despegando: 0, pico: 1, null: 2, undefined: 2, bajando: 3};
function barraFiltros(v){
  const b = (attr, val, txt, on) => "<button " + attr + '="' + val + '" class="' + (on ? "on" : "") + '">' + txt + "</button>";
  return '<div class="filtros"><div class="g"><span class="rot">Etiqueta</span>' + b("data-fe", "", "Todas", !F.est.length) +
    [["despegando", "Despegando"], ["pico", "En el pico"], ["bajando", "Bajando"], ["sin", "Sin etiqueta"]].map(x => b("data-fe", x[0], x[1], F.est.includes(x[0]))).join("") +
    '</div><div class="g"><span class="rot">Puntaje</span>' + [[0, "Todos"], [6, "6+"], [8, "8+"], [9, "9+"]].map(x => b("data-fm", x[0], x[1], F.min[v] === x[0])).join("") +
    '</div><div class="g"><span class="rot">Ordenar por</span>' + [["tendencia", "Tendencia"], ["puntaje", "Puntaje"], ["medios", "Medios"]].map(x => b("data-fo", x[0], x[1], F.ord[v] === x[0])).join("") + "</div></div>";
}
function aplicarFiltros(lista, v){   // lista de {t, cat}
  const pt = x => x.t.ia ? x.t.ia.puntaje : -1;
  let l = lista.filter(x => (!F.est.length || F.est.includes(x.t.estado || "sin")) && (F.min[v] === 0 || pt(x) >= F.min[v]));
  const o = F.ord[v];
  l.sort((a, b) => o === "puntaje" ? (pt(b) - pt(a)) || (b.t.medios - a.t.medios)
    : o === "medios" ? (b.t.medios - a.t.medios) || (pt(b) - pt(a))
    : (RANGO[a.t.estado] - RANGO[b.t.estado]) || (pt(b) - pt(a)) || (b.t.medios - a.t.medios));
  return l;
}
const sinResultados = '<div class="vacio">Ningún tema cumple con esos filtros. Probá con "Todas" o con un puntaje más bajo.</div>';
const MARCAS = {personal: ["Brief: Personal", "mis redes personales (marca personal como sourcer IT / RRHH)"], growup: ["Brief: Grow UP HR", "las redes de Grow UP HR"]};

function guardar(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = u => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
const num = n => Number(n || 0).toLocaleString("es-AR");

function hace(iso){
  if(!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if(m < 1) return "recién";
  if(m < 60) return "hace " + m + " min";
  const h = Math.round(m / 60);
  if(h < 48) return "hace " + h + " h";
  return "hace " + Math.round(h / 24) + " días";
}
function toast(t){ const e = document.getElementById("toast"); e.textContent = t; e.classList.add("ver"); setTimeout(() => e.classList.remove("ver"), 2600); }
async function copiar(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Copiado. Pegalo en Claude");
}
function brief(tema, contexto, notas, ia){
  let t = "Quiero armar contenido para " + MARCAS[marca][1] + " sobre este tema que está en tendencia:\n\n";
  t += "TEMA: " + tema + "\n";
  if(contexto) t += "CONTEXTO: " + contexto + "\n";
  if(ia && ia.resumen) t += "RESUMEN: " + ia.resumen + "\n";
  if(ia && ia.angulos){ t += "\nIDEAS QUE TIRÓ EL RADAR (tomalas como punto de partida, mejoralas):\n"; if(ia.angulos.reel) t += "- Reel: " + ia.angulos.reel + "\n"; if(ia.angulos.placa) t += "- Placa: " + ia.angulos.placa + "\n"; if(ia.angulos.linkedin) t += "- LinkedIn: " + ia.angulos.linkedin + "\n"; }
  if(notas && notas.length){ t += "\nNOTAS DE REFERENCIA:\n"; notas.forEach(n => t += "- " + n.titulo + " (" + (n.medio || "") + ") " + (n.link || "") + "\n"); }
  t += "\n" + (notas && notas.length ? "Revisá las notas, " : "Buscá datos actuales y verificados, ") + "decime si conviene subirnos al tema y con qué ángulo (mundo laboral / IT / RRHH), y proponeme: un reel, una placa y un post de LinkedIn.";
  return t;
}
const briefs = [];
function btnBrief(tema, contexto, notas, ia){ briefs.push([tema, contexto, notas, ia]); return '<button data-b="' + (briefs.length - 1) + '">Copiar brief para Claude</button>'; }

function pintarTabs(){
  const tabs = [["paravos", "Para vos"], ["ahora_ar", "En tendencia ahora"], ["calendario", "Calendario"]].concat(Object.entries(D.categorias).map(([k, v]) => [k, v.nombre]));
  document.getElementById("tabs").innerHTML = tabs.map(([k, n]) => '<button data-t="' + esc(k) + '" class="' + (k === tab ? "on" : "") + '">' + esc(n) + "</button>").join("");
  document.getElementById("per").innerHTML = (tab === "ahora_ar" || tab === "paravos" || tab === "calendario") ? "" :
    Object.entries(PERIODOS).map(([k, n]) => '<button data-p="' + k + '" class="' + (k === per ? "on" : "") + '">' + n + "</button>").join("");
}

function vistaAhora(){
  const g = D.tendencias_ar || [], w = (D.wikipedia || {}).temas || [], h = D.hacker_news || [];
  let s = '<div class="aviso"><i>Lo que la gente está buscando y leyendo en este momento.</i>Para audios y hashtags de TikTok: <a href="https://ads.tiktok.com/business/creativecenter/inspiration/popular/hashtag/pc/es" target="_blank" rel="noopener">TikTok Creative Center ↗</a></div><div class="cols">';
  s += '<div class="caja"><div class="rot">Google</div><h2>Búsquedas en Argentina</h2><p>Lo más buscado ahora</p>' + (g.length ? g.slice(0, 25).map(t =>
    '<div class="it"><div class="k"><a href="https://www.google.com/search?q=' + encodeURIComponent(t.tema) + '" target="_blank" rel="noopener">' + esc(t.tema) + "</a> " + (t.estado ? '<span class="est ' + t.estado + '" style="margin:0 0 0 4px">Nuevo</span>' : "") + (t.ia ? ' <span class="pt" style="margin:0 0 0 4px"><b>' + t.ia.puntaje + "/10</b></span>" : "") +
    (t.notas && t.notas[0] ? '<div class="meta"><a href="' + url(t.notas[0].link) + '" target="_blank" rel="noopener">' + esc(t.notas[0].titulo) + "</a></div>" : "") +
    '</div><span class="v">' + esc(t.busquedas) + " · " + hace(t.desde) + "</span>" + btnBrief(t.tema, "Búsqueda en tendencia en Google Argentina (" + t.busquedas + " búsquedas)", t.notas, t.ia).replace("<button", '<button class="cp" title="Copiar brief"').replace("Copiar brief para Claude", "⧉") + "</div>").join("") : '<div class="vacio">Sin datos</div>') + "</div>";
  s += '<div class="caja"><div class="rot">Wikipedia</div><h2>Lo más leído en Argentina</h2><p>' + (D.wikipedia && D.wikipedia.fecha ? "Día " + esc(D.wikipedia.fecha) : "") + "</p>" + (w.length ? w.slice(0, 25).map(t =>
    '<div class="it"><div class="k"><a href="' + url(t.link) + '" target="_blank" rel="noopener">' + esc(t.tema) + '</a></div><span class="v">' + num(t.vistas) + " vistas</span></div>").join("") : '<div class="vacio">Sin datos</div>') + "</div>";
  s += '<div class="caja"><div class="rot">Hacker News</div><h2>Mundo tech</h2><p>Lo que se discute antes de llegar a los diarios (en inglés)</p>' + (h.length ? h.slice(0, 20).map(t =>
    '<div class="it"><div class="k"><a href="' + url(t.link) + '" target="_blank" rel="noopener">' + esc(t.tema) + '</a></div><span class="v"><a href="' + url(t.debate) + '" target="_blank" rel="noopener">' + num(t.puntos) + " pts</a></span></div>").join("") : '<div class="vacio">Sin datos</div>') + "</div>";
  const r = D.reddit || [], bs = D.bluesky || [];
  s += '<div class="caja"><div class="rot">Reddit</div><h2>Comunidades argentinas</h2><p>Lo más votado del día en r/argentina, r/devsarg y r/merval</p>' + (r.length ? r.slice(0, 20).map(t =>
    '<div class="it"><div class="k"><a href="' + url(t.link) + '" target="_blank" rel="noopener">' + esc(t.tema) + '</a><div class="meta">r/' + esc(t.sub) + '</div></div><span class="v">' + (t.puntos ? num(t.puntos) + " votos" : "") + "</span></div>").join("") : '<div class="vacio">Sin datos (Reddit suele bloquear a los robots)</div>') + "</div>";
  s += '<div class="caja"><div class="rot">Bluesky</div><h2>Conversación global</h2><p>Temas en tendencia en la red abierta tipo X (mayormente en inglés)</p>' + (bs.length ? bs.slice(0, 20).map(t =>
    '<div class="it"><div class="k"><a href="' + url(t.link) + '" target="_blank" rel="noopener">' + esc(t.tema) + '</a></div><span class="v">' + (t.posteos ? num(t.posteos) + " posteos" : "") + "</span></div>").join("") : '<div class="vacio">Sin datos</div>') + "</div>";
  (D.extras || []).forEach(x => {
    s += '<div class="caja"><div class="rot">' + esc(x.rotulo) + "</div><h2>" + esc(x.titulo) + "</h2><p>" + esc(x.desc) + "</p>" + x.items.map(t =>
      '<div class="it"><div class="k"><a href="' + url(t.link) + '" target="_blank" rel="noopener">' + esc(t.tema) + "</a>" + (t.sub ? '<div class="meta">' + esc(t.sub) + "</div>" : "") + '</div><span class="v">' + esc(t.valor || "") + "</span></div>").join("") + "</div>";
  });
  return s + "</div>";
}

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const TIPOS = {feriado: "Feriado", laboral: "Mundo laboral", tech: "Tecnología", comercial: "Comercial", social: "Social"};
const faltan = n => n === 0 ? "Hoy" : n === 1 ? "Mañana" : "En " + n + " días";
function vistaCalendario(){
  const c = D.calendario || [];
  if(!c.length) return '<div class="vacio">Sin fechas cargadas.</div>';
  let s = '<div class="aviso"><i>Lo que ya se sabe que va a ser tema.</i>Feriados de Argentina y fechas del mundo laboral y tech de los próximos 5 meses, con una idea de contenido para cada una. Conviene tener la pieza lista unos días antes.</div>', mes = "";
  c.forEach(x => {
    const d = new Date(x.fecha + "T12:00:00"), m = MESES[d.getMonth()] + " " + d.getFullYear();
    if(m !== mes){ mes = m; s += '<div class="mes">' + m + "</div>"; }
    s += '<div class="dia"><div class="f">' + d.getDate() + " " + MESES[d.getMonth()].slice(0, 3) + "<small>" + DIAS[d.getDay()] + " · " + faltan(x.faltan) + '</small></div><div><div class="rot" style="margin:0 0 4px">' + esc(x.tipo === "feriado" && x.detalle ? x.detalle : (TIPOS[x.tipo] || x.tipo)) + "</div><h3>" + esc(x.nombre) + "</h3>" +
      (x.idea ? "<p>" + esc(x.idea) + '</p><div class="acc">' + btnBrief(x.nombre + " (" + d.getDate() + " de " + MESES[d.getMonth()] + ")", "Fecha del calendario, " + faltan(x.faltan).toLowerCase() + ". Idea de partida: " + x.idea, []) + "</div>" : "") + "</div></div>";
  });
  return s;
}
function seViene(){
  const c = (D.calendario || []).filter(x => x.faltan <= 14).slice(0, 6);
  return c.length ? '<div class="viene"><span class="rot">Se viene</span>' + c.map(x => '<span class="chip">' + esc(x.nombre) + " · " + faltan(x.faltan).toLowerCase() + "</span>").join("") + "</div>" : "";
}
const est = e => ESTADOS[e] ? '<span class="est ' + e + '">' + ESTADOS[e] + "</span>" : "";
const pts = ia => ia ? '<span class="pt">Te sirve<b>' + ia.puntaje + "/10</b></span>" : "";
function angulos(ia){
  if(!ia || !ia.angulos) return "";
  const a = ia.angulos, f = (k, n) => a[k] ? "<div><span>" + n + "</span>" + esc(a[k]) + "</div>" : "";
  return '<div class="ang">' + f("reel", "Gancho para reel") + f("placa", "Idea de placa") + f("linkedin", "Arranque de LinkedIn") + "</div>";
}
function tarjeta(t, i, contexto, rotulo){
  const ia = t.ia;
  return '<div class="card"><div class="n">' + (i + 1) + "</div><div>" + (rotulo ? '<div class="rot" style="margin:0 0 6px">' + esc(rotulo) + "</div>" : "") +
    "<div>" + est(t.estado) + pts(ia) + "</div><h3>" + esc(ia && ia.titulo ? ia.titulo : t.titulo) + '</h3><div class="meta">' +
    (t.medios > 1 ? "<b>" + t.medios + " medios</b>" : "1 medio") + " · " + t.notas_total + (t.notas_total === 1 ? " nota" : " notas") + " · última " + hace(t.ultima) +
    (t.primera && t.primera !== t.ultima ? " · arrancó " + hace(t.primera) : "") + '</div></div><div class="cuerpo">' +
    (ia && ia.resumen ? '<p class="res">' + esc(ia.resumen) + "</p>" : "") + angulos(ia) +
    (ia && ia.porque && !ia.angulos ? '<div class="orig">' + esc(ia.porque) + "</div>" : "") +
    '<div class="meta">' + esc((t.lista_medios || []).join(" · ")) + "</div>" +
    "<details><summary>Ver notas</summary><ul>" + t.notas.map(n => '<li><a href="' + url(n.link) + '" target="_blank" rel="noopener">' + esc(n.titulo) + "</a> — " + esc(n.medio) + "</li>").join("") + "</ul></details>" +
    '<div class="acc">' + btnBrief(ia && ia.titulo ? ia.titulo : t.titulo, contexto, t.notas, ia) + "</div></div></div>";
}

function vistaCategoria(){
  const b = D.categorias[tab].periodos[per] || {temas: []};
  let s = "";
  if(b.calientes && b.calientes.length) s += '<div class="cal">' + b.calientes.map(c => '<span class="chip">' + esc(c.palabra) + " · " + c.medios + "</span>").join("") + "</div>";
  if(!b.temas.length) return s + '<div class="vacio">No hay notas para este tema en este período.</div>';
  const l = aplicarFiltros(b.temas.map(t => ({t})), "cat");
  return s + barraFiltros("cat") + (l.length ? l.map((x, i) => tarjeta(x.t, i, x.t.medios + " medios hablando del tema (" + D.categorias[tab].nombre + ", " + PERIODOS[per].toLowerCase() + ")")).join("") : sinResultados);
}

function vistaParaVos(){
  const ia = D.ia || {};
  if(!ia.activa) return '<div class="aviso"><i>Falta activar la inteligencia artificial.</i>Cuando esté la clave de Gemini cargada en GitHub, acá vas a ver solo los temas que te sirven, con resumen e ideas de contenido. Mientras tanto, las etiquetas de velocidad ya funcionan en cada tema.</div>' + vistaDespegando();
  const vistos = {}, lista = [];
  Object.values(D.categorias).forEach(c => ["ahora", "24h"].forEach(p => (c.periodos[p].temas || []).forEach(t => {
    if(!t.ia) return;
    const prev = vistos[t.ia.tid];
    if(prev){ if(t.medios > prev.t.medios) prev.t = t; return; }
    lista.push(vistos[t.ia.tid] = {t, cat: c.nombre});
  })));
  let s = '<div class="aviso"><i>Lo que hoy te sirve para hacer contenido.</i>Todos los temas de las últimas 24 h que la IA ya puntuó para tu marca. Usá los filtros para cruzar tendencia y puntaje.' + (ia.error ? " (La IA falló en la última corrida: " + esc(ia.error) + ")" : "") + "</div>";
  const tr = (D.tendencias_ar || []).filter(t => t.ia && t.ia.puntaje >= 6);
  if(tr.length) s += '<div class="cal">' + tr.map(t => '<span class="chip">Google: ' + esc(t.tema) + " · " + t.ia.puntaje + "/10</span>").join("") + "</div>";
  if(!lista.length) return s + '<div class="vacio">' + (ia.ultima ? "Todavía no hay temas puntuados. Mirá las pestañas por tema." : "La IA todavía no hizo su primera pasada. Aparece en la próxima corrida del robot.") + "</div>";
  const l = aplicarFiltros(lista, "paravos");
  return s + barraFiltros("paravos") + '<div class="meta" style="margin:-6px 0 12px">' + l.length + " de " + lista.length + " temas</div>" + (l.length ? l.slice(0, 40).map((x, i) => tarjeta(x.t, i, x.t.medios + " medios hablando del tema (" + x.cat + ")", x.cat)).join("") : sinResultados);
}
function vistaDespegando(){
  const l = [];
  Object.values(D.categorias).forEach(c => (c.periodos["24h"].temas || []).forEach(t => { if(t.estado === "despegando") l.push({t, cat: c.nombre}); }));
  l.sort((a, b) => b.t.medios - a.t.medios);
  return l.length ? l.map((x, i) => tarjeta(x.t, i, x.t.medios + " medios hablando del tema (" + x.cat + ")", x.cat)).join("") : '<div class="vacio">Ahora no hay temas despegando.</div>';
}

function pintar(){
  briefs.length = 0;
  pintarTabs();
  document.getElementById("main").innerHTML = tab === "ahora_ar" ? vistaAhora() : tab === "paravos" ? seViene() + vistaParaVos() : tab === "calendario" ? vistaCalendario() : vistaCategoria();
  document.getElementById("act").textContent = "Actualizado " + hace(D.generado) + " · " + num(D.notas_leidas) + " notas leídas" + (D.ia && D.ia.activa ? " · IA activa" : " · IA sin activar");
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.t){ tab = b.dataset.t; guardar("radar_tab", tab); pintar(); window.scrollTo(0, 0); }
  else if(b.dataset.fe !== undefined || b.dataset.fm !== undefined || b.dataset.fo !== undefined){
    const v = tab === "paravos" ? "paravos" : "cat";
    if(b.dataset.fe !== undefined){ const e = b.dataset.fe; if(!e) F.est = []; else F.est = F.est.includes(e) ? F.est.filter(x => x !== e) : F.est.concat(e); }
    if(b.dataset.fm !== undefined) F.min[v] = +b.dataset.fm;
    if(b.dataset.fo !== undefined) F.ord[v] = b.dataset.fo;
    guardar("radar_filtros", JSON.stringify(F)); pintar();
  }
  else if(b.dataset.p){ per = b.dataset.p; guardar("radar_per", per); pintar(); }
  else if(b.dataset.b !== undefined){ copiar(brief(...briefs[+b.dataset.b])); }
  else if(b.id === "btnMarca"){ marca = marca === "personal" ? "growup" : "personal"; guardar("radar_marca", marca); b.textContent = MARCAS[marca][0]; toast(marca === "personal" ? "Los briefs que copies van a pedir contenido para tus redes personales" : "Los briefs que copies van a pedir contenido para Grow UP HR"); }
  else if(b.id === "btnTema"){ const t = document.documentElement.dataset.tema === "suplente" ? "titular" : "suplente"; document.documentElement.dataset.tema = t; guardar("radar_tema", t); }
});

async function cargar(){
  try{
    const r = await fetch("data/latest.json?t=" + Date.now(), {cache: "no-store"});
    if(!r.ok) throw new Error(r.status);
    D = await r.json();
    if(tab !== "ahora_ar" && tab !== "paravos" && tab !== "calendario" && !D.categorias[tab]) tab = "paravos";
    pintar();
  }catch(e){
    if(!D) document.getElementById("main").innerHTML = '<div class="vacio">Todavía no hay datos. El robot los genera en su primera corrida.</div>';
    document.getElementById("act").textContent = "Sin datos";
  }
}
document.documentElement.dataset.tema = leer("radar_tema") === "suplente" ? "suplente" : "titular";
tab = leer("radar_tab") || tab; per = PERIODOS[leer("radar_per")] ? leer("radar_per") : per;
marca = MARCAS[leer("radar_marca")] ? leer("radar_marca") : marca; document.getElementById("btnMarca").textContent = MARCAS[marca][0];
cargar(); setInterval(cargar, 10 * 60 * 1000);
</script>
